<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kebab Höhle Bonusprogramm</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="register-page">

    <div class="logo-background"></div>

    <div class="register-card">

        <h1>Bonusprogramm</h1>

        <form method="POST">

            <label>Vorname</label>
            <input type="text" name="vorname" required>

            <label>Nachname</label>
            <input type="text" name="nachname" required>

            <label>Geburtsdatum</label>
            <input type="date" name="geburtsdatum" required>

            <label>Telefonnummer (optional)</label>
            <input type="text" name="telefon">

            <label>Adresse (optional)</label>
            <input type="text" name="adresse">

            <label class="checkbox-row">
                <input type="checkbox" name="datenschutz" required>
                <span>Ich akzeptiere die Datenschutzhinweise</span>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" name="angebote">
                <span>Ich möchte Angebote erhalten</span>
            </label>

            <button type="submit">Registrieren</button>

        </form>

    </div>

</div>

</body>
</html>
