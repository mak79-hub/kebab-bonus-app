<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kebab Höhle Bonusprogramm</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container">

    <div class="logo">
        🔥 KEBAB HÖHLE 🔥
    </div>

    <div class="card">

        <h1>Bonusprogramm</h1>

        <form method="POST">

            <label>Vorname</label>
            <input type="text" name="vorname" required>

            <label>Nachname</label>
            <input type="text" name="nachname" required>

            <label>Geburtsdatum</label>
            <input type="date" name="geburtsdatum" required>

            <label>Telefonnummer (optional)</label>
            <input type="text" name="telefon">

            <label>Adresse (optional)</label>
            <input type="text" name="adresse">

            <br>

            <label>
                <input type="checkbox" required>
                Ich akzeptiere die Datenschutzhinweise
            </label>

            <br>

            <label>
                <input type="checkbox" name="angebote">
                Ich möchte Angebote erhalten
            </label>

            <br><br>

            <button type="submit">
                Registrieren
            </button>

        </form>

    </div>

</div>

</body>
</html>
