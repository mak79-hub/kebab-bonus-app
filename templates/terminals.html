<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Terminalzugang · {{ shop.name }}</title><link rel="stylesheet" href="/static/portal.css"></head><body><main class="portal-shell"><header class="portal-header"><div class="portal-brand"><strong>{{ shop.name }}</strong><small>Geschützter Bestellterminalzugang</small></div></header><h1>{{ 'Bestellgerät aktivieren' if activation else 'Bestellterminals' }}</h1>{% if message %}<div class="notice" role="status">{{ message }}</div>{% endif %}<form method="post" class="panel">{% if activation %}<label>Einmaligen Code aus dem Chefbereich eingeben</label><input name="code" autocomplete="one-time-code" maxlength="20" required><button class="portal-btn">Dieses Gerät aktivieren</button>{% else %}<label>Station</label><select name="station"><option>TERMINAL_1</option><option>TERMINAL_2</option></select><button class="portal-btn" name="action" value="pair">Aktivierungscode erstellen</button><button class="portal-btn danger" name="action" value="revoke">Bestehende Geräte dieser Station sperren</button>{% endif %}</form><a class="text-link" href="{{ '/' if activation else '/chef-einstellungen' }}">Zurück</a></main></body></html>
