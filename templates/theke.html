<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theke – Kebap Höhle XXL</title>
    <style>
        :root {
            --dark: #0d0d0d;
            --card: #1a1a1a;
            --card-hover: #222;
            --red: #c41e3a;
            --green: #22c55e;
            --orange: #f59e0b;
            --blue: #3b82f6;
            --gray: #888;
            --gray-light: #aaa;
            --border: #2a2a2a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--dark); color: #fff; min-height: 100vh;
        }

        .header {
            position: sticky; top: 0; z-index: 100;
            background: linear-gradient(135deg, #1a1a1a, #111);
            border-bottom: 1px solid var(--border);
            padding: 14px 20px;
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: wrap; gap: 8px;
        }
        .header-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
        .header-logo { font-size: 1.1rem; font-weight: 900; color: var(--red); white-space: nowrap; }
        .header-title { font-size: 0.85rem; color: var(--gray); }
        .header-badges { display: flex; gap: 8px; flex-wrap: wrap; }
        .header-link {
            color: #fff; background: #333; text-decoration: none; border-radius: 16px;
            padding: 6px 12px; font-size: 0.75rem; font-weight: 700;
        }
        .camera-btn {
            border: 0; cursor: pointer; background: rgba(245,158,11,0.18);
            color: var(--orange);
        }
        .camera-btn.active { background: rgba(34,197,94,0.15); color: var(--green); }
        .header-badge {
            font-size: 0.8rem; font-weight: 700; padding: 5px 12px;
            border-radius: 16px; white-space: nowrap;
        }
        .badge-open { background: rgba(245,158,11,0.15); color: var(--orange); }
        .badge-pending { background: rgba(59,130,246,0.15); color: var(--blue); }
        .badge-conn { background: rgba(136,136,136,0.15); color: var(--gray); font-weight: 400; font-size: 0.7rem; }

        .orders-container {
            padding: 12px 16px 30px; max-width: 900px; margin: 0 auto;
            display: flex; flex-direction: column; gap: 8px;
        }

        .lookup-bar {
            position: sticky; top: 67px; z-index: 90;
            max-width: 900px; margin: 0 auto; padding: 12px 16px;
            background: rgba(13,13,13,0.96); display: flex; gap: 8px;
        }
        .lookup-input {
            flex: 1; min-width: 0; padding: 14px 16px; border-radius: 12px;
            border: 1px solid var(--border); background: var(--card); color: #fff;
            font-size: 1rem; outline: none;
        }
        .lookup-input:focus { border-color: var(--blue); }
        .lookup-btn {
            padding: 0 20px; border: 0; border-radius: 12px;
            background: var(--blue); color: #fff; font-weight: 800; cursor: pointer;
        }
        .scan-btn { background: var(--green); }
        .lookup-message {
            display: none; max-width: 868px; margin: 0 auto 4px; padding: 0 16px;
            color: #ef4444; font-size: 0.85rem;
        }
        .lookup-message.show { display: block; }

        .queue-row {
            width: 100%; min-height: 72px; border: 1px solid var(--border);
            border-left: 5px solid var(--orange); border-radius: 12px;
            background: var(--card); color: #fff; padding: 12px 16px;
            display: grid; grid-template-columns: 100px minmax(0,1fr) auto 26px;
            align-items: center; gap: 14px; cursor: pointer; text-align: left;
            transition: background 0.15s, transform 0.15s;
        }
        .queue-row:active { transform: scale(0.99); }
        .queue-row:hover { background: var(--card-hover); }
        .queue-row.row-pending { border-left-color: var(--blue); }
        .queue-row.row-failed { border-left-color: #ef4444; }
        .queue-row.row-paid { border-left-color: var(--green); opacity: 0.55; }
        .queue-row.row-cancelled { border-left-color: var(--gray); opacity: 0.4; }
        .queue-number { font-size: 1.55rem; font-weight: 900; }
        .queue-info { min-width: 0; }
        .queue-status { font-size: 0.78rem; font-weight: 800; color: var(--orange); }
        .queue-sub { margin-top: 4px; color: var(--gray); font-size: 0.78rem; }
        .queue-total { font-size: 1.15rem; font-weight: 900; color: var(--red); white-space: nowrap; }
        .queue-arrow { font-size: 1.5rem; color: var(--gray); }

        .detail-view {
            display: none; position: fixed; inset: 0; z-index: 150;
            background: var(--dark); overflow-y: auto;
        }
        .detail-view.show { display: block; }
        .detail-topbar {
            position: sticky; top: 0; z-index: 10; padding: 12px 18px;
            background: #111; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between; gap: 12px;
        }
        .detail-back {
            border: 0; border-radius: 10px; background: #333; color: #fff;
            padding: 12px 16px; font-size: 0.9rem; font-weight: 800; cursor: pointer;
        }
        .detail-heading { font-size: 0.9rem; color: var(--gray); }
        .detail-content { max-width: 900px; margin: 0 auto; padding: 20px; }
        .detail-view .order-card { border-width: 2px; opacity: 1; }
        .detail-view .order-header { padding: 22px 24px; }
        .detail-view .order-number { font-size: 3rem; }
        .detail-view .order-total { font-size: 2rem; }
        .detail-view .order-items { padding: 0 24px 18px; }
        .detail-view .order-item { padding: 16px 0; }
        .detail-view .item-name, .detail-view .item-price { font-size: 1.05rem; }
        .detail-view .item-details { font-size: 0.9rem; }
        .detail-view .order-footer { padding: 0 24px 28px; }

        .scanner-view {
            position: fixed; width: 260px; height: 210px; left: -10000px; bottom: 0;
            overflow: hidden; opacity: 0; pointer-events: none;
        }
        #backgroundQrReader { width: 240px; height: 190px; }

        .order-card {
            background: var(--card); border-radius: 16px; overflow: hidden;
            border: 2px solid transparent; transition: all 0.2s;
        }
        .order-card.status-wartet { border-color: var(--orange); }
        .order-card.status-gestartet { border-color: var(--blue); }
        .order-card.status-ausstehend { border-color: var(--blue); }
        .order-card.status-bezahlt { border-color: var(--green); opacity: 0.6; }
        .order-card.status-fehlgeschlagen { border-color: #ef4444; }
        .order-card.status-storniert { border-color: var(--gray); opacity: 0.4; }

        .order-header {
            padding: 16px 20px; display: flex; align-items: flex-start;
            justify-content: space-between; gap: 12px;
        }
        .order-number { font-size: 2.2rem; font-weight: 900; line-height: 1; }
        .order-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
        .order-time { font-size: 0.85rem; color: var(--gray); }
        .order-total { font-size: 1.6rem; font-weight: 900; color: var(--red); }

        .order-status {
            display: inline-block; padding: 4px 10px; border-radius: 8px;
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; margin-top: 6px;
        }
        .st-wartet { background: rgba(245,158,11,0.15); color: var(--orange); }
        .st-gestartet { background: rgba(59,130,246,0.15); color: var(--blue); }
        .st-ausstehend { background: rgba(59,130,246,0.15); color: var(--blue); }
        .st-bezahlt { background: rgba(34,197,94,0.15); color: var(--green); }
        .st-fehlgeschlagen { background: rgba(239,68,68,0.15); color: #ef4444; }
        .st-storniert { background: rgba(136,136,136,0.15); color: var(--gray); }

        .order-bonus {
            padding: 0 20px 8px; font-size: 0.8rem; color: var(--gray);
        }
        .order-bonus.hat-konto { color: var(--green); }

        .order-items { padding: 0 20px 12px; }
        .order-item { padding: 10px 0; border-top: 1px solid var(--border); }
        .order-item:first-child { border-top: none; }
        .item-main {
            display: flex; justify-content: space-between; align-items: flex-start;
            gap: 8px; margin-bottom: 2px;
        }
        .item-name { font-size: 0.9rem; font-weight: 600; line-height: 1.3; }
        .item-price { font-size: 0.9rem; font-weight: 700; white-space: nowrap; }
        .item-details { font-size: 0.78rem; color: var(--gray); line-height: 1.5; }
        .item-detail { margin-top: 1px; }
        .item-detail.upgrade { color: var(--green); font-weight: 600; }
        .item-detail.extra { color: var(--orange); }
        .item-detail.without { color: #ef4444; }
        .item-detail.beilage { color: var(--gray-light); }
        .item-detail .price-tag { color: var(--orange); font-weight: 600; }

        .order-footer { padding: 0 20px 20px; }

        .pay-btn {
            width: 100%; padding: 18px; border: none; border-radius: 14px;
            font-size: 1.1rem; font-weight: 800; cursor: pointer;
            background: var(--blue); color: #fff;
            text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.15s; -webkit-tap-highlight-color: transparent;
        }
        .pay-btn:active { transform: scale(0.97); }
        .pay-btn:disabled { background: #444; cursor: not-allowed; transform: none; }

        .retry-btn {
            width: 100%; padding: 14px; border: 2px solid var(--orange); border-radius: 14px;
            font-size: 0.95rem; font-weight: 700; cursor: pointer;
            background: transparent; color: var(--orange);
            margin-top: 8px; transition: all 0.15s;
        }
        .retry-btn:active { transform: scale(0.97); }

        .paid-info { text-align: center; padding: 12px; }
        .paid-info .status-label { font-size: 1rem; font-weight: 700; color: var(--green); }
        .paid-info .bonus-msg {
            font-size: 0.85rem; color: var(--green); font-weight: 600;
            margin-top: 8px; padding: 8px 12px;
            background: rgba(34,197,94,0.1); border-radius: 8px;
        }
        .paid-info .no-bonus {
            font-size: 0.8rem; color: var(--gray); margin-top: 6px;
        }

        .empty-state { text-align: center; padding: 80px 20px; color: var(--gray); grid-column: 1 / -1; }
        .empty-icon { font-size: 64px; margin-bottom: 16px; }
        .empty-title { font-size: 1.3rem; font-weight: 700; color: #fff; margin-bottom: 8px; }

        /* ===== DIALOG ===== */
        .dialog-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 200; display: none;
            align-items: center; justify-content: center; backdrop-filter: blur(8px);
        }
        .dialog-overlay.show { display: flex; }
        .dialog {
            background: var(--card); border-radius: 20px; padding: 28px 24px;
            max-width: 400px; width: 90%; text-align: center;
        }
        .dialog h3 { font-size: 1.2rem; margin-bottom: 6px; }
        .dialog .dialog-order { font-size: 0.85rem; color: var(--gray); margin-bottom: 4px; }
        .dialog .dialog-amount {
            font-size: 1.8rem; font-weight: 900; color: var(--red); margin-bottom: 20px;
        }
        .dialog-btn {
            width: 100%; padding: 16px; border: none; border-radius: 12px;
            font-size: 1rem; font-weight: 700; cursor: pointer;
            margin-bottom: 10px; transition: all 0.15s;
        }
        .dialog-btn:active { transform: scale(0.97); }
        .dialog-btn.bar { background: var(--green); color: #fff; }
        .dialog-btn.sumup { background: var(--blue); color: #fff; }
        .dialog-btn.cancel { background: #333; color: var(--gray-light); margin-bottom: 0; }
        .dialog-btn:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; }
        .dialog-confirmation { margin-top: 8px; }
        .dialog-confirmation .confirm-text {
            font-size: 0.95rem; margin-bottom: 16px; line-height: 1.4;
        }
        .dialog-confirmation .confirm-yes { background: var(--green); color: #fff; }
        .dialog-confirmation .confirm-no { background: #333; color: var(--gray-light); margin-bottom: 0; }

        .sumup-progress { margin: 16px 0; }
        .sumup-step {
            padding: 10px; margin-bottom: 8px; border-radius: 10px;
            font-size: 0.85rem; font-weight: 600;
        }
        .sumup-step.active { background: rgba(59,130,246,0.15); color: var(--blue); }
        .sumup-step.done { background: rgba(34,197,94,0.15); color: var(--green); }
        .sumup-step.error { background: rgba(239,68,68,0.15); color: #ef4444; }
        .sumup-step.pending { background: rgba(136,136,136,0.1); color: var(--gray); }

        .sumup-actions { margin-top: 12px; display: flex; gap: 8px; }
        .sumup-actions .dialog-btn { flex: 1; margin-bottom: 0; font-size: 0.85rem; padding: 14px; }
        .sumup-actions .success-btn { background: var(--green); color: #fff; }
        .sumup-actions .fail-btn { background: #ef4444; color: #fff; }
        .sumup-actions .abort-btn { background: #333; color: var(--gray-light); }

        @media (max-width: 500px) {
            .orders-container { padding: 8px 10px 24px; }
            .lookup-bar { top: 105px; padding: 10px; }
            .lookup-btn { padding: 0 14px; }
            .lookup-bar { flex-wrap: wrap; }
            .lookup-input { flex-basis: calc(100% - 90px); }
            .scan-btn { flex: 1 0 100%; padding: 13px; }
            .queue-row { grid-template-columns: 76px minmax(0,1fr) auto 18px; gap: 8px; padding: 10px; }
            .queue-number { font-size: 1.3rem; }
            .queue-total { font-size: 1rem; }
            .detail-content { padding: 10px; }
            .detail-view .order-number { font-size: 2.2rem; }
            .order-number { font-size: 1.8rem; }
            .order-total { font-size: 1.3rem; }
            .header { padding: 12px 16px; }
        }
    </style>
</head>

    <div class="header-left">

    </div>
    <div class="header-badges">
        {% if theke_ist_mitarbeiter %}<a class="header-link" href="/mitarbeiter">Bonusverwaltung</a>{% endif %}

        <div class="header-badge badge-pending" id="badgePending">0 Zahlungen</div>
        <div class="header-badge badge-conn" id="badgeConn">Demo – nicht verbunden</div>
    </div>
</div>

<div class="lookup-bar">
    <input class="lookup-input" id="orderLookup" type="text" inputmode="text"
           placeholder="Bestellnummer oder QR-Code" autocomplete="off">

<div class="lookup-message" id="lookupMessage"></div>

<div class="orders-container" id="ordersContainer"></div>

<div class="detail-view" id="detailView">
    <div class="detail-topbar">
        <button class="detail-back" onclick="closeOrderDetail()">← BESTELLLISTE</button>
        <div class="detail-heading">Aktuelle Bestellung bearbeiten</div>
    </div>
    <div class="detail-content" id="detailContent"></div>
</div>

<div class="scanner-view" id="scannerView">

<script>
// ============================================================
// SICHERHEIT: HTML ESCAPING
// ============================================================
function esc(str) {
    if (str === null || str === undefined) return '';
    var div = document.createElement('div');
    div.appendChild(document.createTextNode(String(str)));
    return div.innerHTML;
}

// ============================================================
// PREISBERECHNUNG IN CENT (kein Gleitkomma)
// ============================================================
function euroToCent(euro) {
    return Math.round(euro * 100);
}

function centToEuro(cent) {
    var Euro = Math.floor(cent / 100);
    var Cents = cent % 100;
    return Euro + ',' + (Cents < 10 ? '0' : '') + Cents + ' €';
}

function formatTime(isoString) {
    var d = new Date(isoString);
    return (d.getHours() < 10 ? '0' : '') + d.getHours() + ':' +
           (d.getMinutes() < 10 ? '0' : '') + d.getMinutes() + ' Uhr';
}

function generateIdempotencyId() {
    if (window.crypto && typeof window.crypto.randomUUID === 'function') {
        return window.crypto.randomUUID();
    }
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
}

function calculateItemTotal(item) {
    if (item.preisIstServerGesamt) {
        return Number(item.gesamtpreis) || 0;
    }
    var extrasProStueck = (item.extras || []).reduce(function(sum, extra) {
        return sum + (Number(extra.preis) || 0);
    }, 0);
    var upgradeProStueck = item.upgrade ? (Number(item.upgrade.preis) || 0) : 0;
    var beilageProStueck = item.beilage && typeof item.beilage === 'object'
        ? (Number(item.beilage.preis) || 0) : 0;
    return (Number(item.menge) || 0) *
        ((Number(item.einzelpreis) || 0) + extrasProStueck + upgradeProStueck + beilageProStueck);
}

function calculateOrderTotal(order) {
    return (order.items || []).reduce(function(sum, item) {
        return sum + calculateItemTotal(item);
    }, 0);
}

function calculateBonusPoints(totalCent) {
    // Bestehende Bonusregel im Flask-Backend: int(Gesamtbetrag), also volle Euro.
    return Math.floor(totalCent / 100);
}

var IS_LOCAL_DEMO = window.location.protocol === 'file:';
var orders = IS_LOCAL_DEMO ? createDemoOrders() : [];
var processingPayments = {};
var currentOrderId = null;
var backgroundQrScanner = null;
var scannerActive = false;
var lastScannedValue = '';
var lastScannedAt = 0;

// ============================================================
// RENDERING
// ============================================================
function renderOrders() {
    var container = document.getElementById('ordersContainer');
    var openOrders = orders.filter(function(o) {
        return o.status !== STATUS.BEZAHLT && o.status !== STATUS.STORNIERT;
    });
    var pendingPayments = orders.filter(function(o) {
        return o.status === STATUS.ZAHLUNG_GESTARTET || o.status === STATUS.ZAHLUNG_AUSSTEHEND;
    });

    document.getElementById('badgeOpen').textContent = openOrders.length + ' offen';
    document.getElementById('badgePending').textContent = pendingPayments.length + ' Zahlungen';

    if (!orders.length) {
        container.innerHTML = '<div class="empty-state">' +
            '<div class="empty-icon">📋</div>' +
            '<div class="empty-title">Keine Bestellungen</div>' +
            '<p>Neue Bestellungen erscheinen hier automatisch.</p></div>';
        return;
    }

    var sorted = orders.slice().sort(function(a, b) {
        var aClosed = a.status === STATUS.BEZAHLT || a.status === STATUS.STORNIERT;
        var bClosed = b.status === STATUS.BEZAHLT || b.status === STATUS.STORNIERT;
        if (aClosed !== bClosed) return aClosed ? 1 : -1;
        return new Date(a.erstellt_am) - new Date(b.erstellt_am);
    });

    container.innerHTML = sorted.map(renderQueueRow).join('');
    renderActiveDetail();
}

function renderQueueRow(order) {
    var rowClass = '';
    if (order.status === STATUS.ZAHLUNG_GESTARTET || order.status === STATUS.ZAHLUNG_AUSSTEHEND) rowClass = ' row-pending';
    if (order.status === STATUS.ZAHLUNG_FEHLGESCHLAGEN) rowClass = ' row-failed';
    if (order.status === STATUS.BEZAHLT) rowClass = ' row-paid';
    if (order.status === STATUS.STORNIERT) rowClass = ' row-cancelled';
    var anzahl = (order.items || []).reduce(function(sum, item) { return sum + Number(item.menge || 0); }, 0);
    var bonus = order.bonus_kunde ? ' · Bonuskunde' : '';
    return '<button class="queue-row' + rowClass + '" onclick="openOrderDetail(\'' + esc(order.internalId) + '\')">' +
        '<div class="queue-number">#' + esc(order.visibleNumber) + '</div>' +
        '<div class="queue-info"><div class="queue-status">' + esc(STATUS_LABELS[order.status] || order.status) + '</div>' +
        '<div class="queue-sub">' + formatTime(order.erstellt_am) + ' · ' + anzahl + ' Artikel' + bonus + '</div></div>' +
        '<div class="queue-total">' + centToEuro(order.Gesamtbetrag) + '</div>' +
        '<div class="queue-arrow">›</div></button>';
}

function openOrderDetail(internalId) {
    var order = orders.find(function(o) { return o.internalId === internalId; });
    if (!order) return;
    currentOrderId = internalId;
    renderActiveDetail();
    document.getElementById('detailView').classList.add('show');
    document.body.style.overflow = 'hidden';
}

function closeOrderDetail() {
    currentOrderId = null;
    document.getElementById('detailView').classList.remove('show');
    document.getElementById('detailContent').innerHTML = '';
    document.body.style.overflow = '';
    document.getElementById('orderLookup').focus();
}

function renderActiveDetail() {
    if (!currentOrderId) return;
    var order = orders.find(function(o) { return o.internalId === currentOrderId; });
    if (!order) { closeOrderDetail(); return; }
    document.getElementById('detailContent').innerHTML = renderOrderCard(order);
}

function findAndOpenOrder() {
    var input = document.getElementById('orderLookup');
    var value = input.value.trim();
    if (openOrderFromCode(value)) {
        input.value = '';
    }
}

function openOrderFromCode(rawValue) {
    var value = String(rawValue || '').trim().replace(/^ORDER:/i, '').replace(/^#/, '');
    var message = document.getElementById('lookupMessage');
    var order = orders.find(function(o) {
        return String(o.visibleNumber) === value || o.token === value || o.internalId === value;
    });
    if (!order) {
        message.textContent = 'Keine Bestellung zu „' + value + '“ gefunden.';
        message.classList.add('show');
        return false;
    }
    message.classList.remove('show');
    openOrderDetail(order.internalId);
    return true;
}

document.getElementById('orderLookup').addEventListener('keydown', function(event) {
    if (event.key === 'Enter') findAndOpenOrder();
});

async function startQrScanner(automaticStart) {
    var cameraButton = document.getElementById('cameraButton');
    if (scannerActive) return;
    if (typeof Html5Qrcode === 'undefined') {
        cameraButton.textContent = 'Kamera nicht verfügbar';
        return;
    }
    try {
        cameraButton.textContent = 'Kamera wird gestartet …';
        backgroundQrScanner = backgroundQrScanner || new Html5Qrcode('backgroundQrReader');
        await backgroundQrScanner.start(
            { facingMode: 'environment' },
            { fps: 10, qrbox: { width: 220, height: 220 } },
            onBackgroundQrScan,
            function() {}
        );
        scannerActive = true;
        cameraButton.textContent = '● Kamera aktiv';
        cameraButton.classList.add('active');
        localStorage.setItem('theke_kamera_erlaubt', '1');
    } catch (error) {
        scannerActive = false;
        cameraButton.classList.remove('active');
        cameraButton.textContent = automaticStart ? 'Kamera aktivieren' : 'Kamera erneut aktivieren';
        console.error('Kamera konnte nicht gestartet werden:', error);
    }
}

function onBackgroundQrScan(decodedText) {
    var code = String(decodedText || '').trim();
    if (!/^ORDER:/i.test(code)) return;
    var now = Date.now();
    if (code === lastScannedValue && now - lastScannedAt < 3000) return;
    lastScannedValue = code;
    lastScannedAt = now;
    loadThekenBestellungen();
}

async function stopQrCameraOnly() {
    scannerActive = false;
    if (backgroundQrScanner && backgroundQrScanner.isScanning) {
        try { await backgroundQrScanner.stop(); } catch (error) {}
    }
    var cameraButton = document.getElementById('cameraButton');
    cameraButton.classList.remove('active');
    cameraButton.textContent = 'Kamera aktivieren';
}

function stopQrScanner() {
    stopQrCameraOnly();
}

document.addEventListener('visibilitychange', function() {
    if (document.hidden) {
        stopQrScanner();
    } else if (!scannerActive && localStorage.getItem('theke_kamera_erlaubt') === '1') {
        startQrScanner(true);
    }
});

function renderOrderCard(order) {
    var isPaid = order.status === STATUS.BEZAHLT;
    var isStorniert = order.status === STATUS.STORNIERT;
    var isFailed = order.status === STATUS.ZAHLUNG_FEHLGESCHLAGEN;
    var stClass = STATUS_CLASSES[order.status] || 'wartet';
    var stLabel = STATUS_LABELS[order.status] || order.status;

    var h = '<div class="order-card status-' + stClass + '" id="order-' + order.internalId + '">';
    h += '<div class="order-header">';
    h += '<div>';
    h += '<div class="order-number">#' + order.visibleNumber + '</div>';
    h += '<div class="order-status st-' + stClass + '">' + esc(stLabel) + '</div>';
    h += '</div>';
    h += '<div class="order-meta">';
    h += '<div class="order-time">' + formatTime(order.erstellt_am) + '</div>';
    h += '<div class="order-total">' + centToEuro(order.Gesamtbetrag) + '</div>';
    h += '</div>';
    h += '</div>';

    h += '<div class="order-bonus' + (order.bonus_kunde ? ' hat-konto' : '') + '">';
    h += order.bonus_kunde ? '🎯 Bonus-Kunde (' + order.punkte + ' Pkte)' : 'Kein Bonus-Konto';
    h += '</div>';

    h += '<div class="order-items">';
    order.items.forEach(function(item) {
        h += '<div class="order-item">';
        h += '<div class="item-main">';
        h += '<div class="item-name">' + item.menge + '× ' + esc(item.produkt_name);
        if (item.variante) h += ' ' + esc(item.variante);
        h += '</div>';
        h += '<div class="item-price">' + centToEuro(calculateItemTotal(item)) + '</div>';
        h += '</div>';
        h += '<div class="item-details">';
        if (item.beilage) {
            var beilageName = typeof item.beilage === 'object' ? item.beilage.name : item.beilage;
            var beilagePreis = typeof item.beilage === 'object' ? (Number(item.beilage.preis) || 0) : 0;
            h += '<div class="item-detail beilage">🍟 ' + esc(beilageName);
            if (beilagePreis > 0) h += ' <span class="price-tag">+' + centToEuro(beilagePreis) + '</span>';
            h += '</div>';
        }
        if (item.extras && item.extras.length) {
            item.extras.forEach(function(ex) {
                var tag = ex.name.indexOf('Ohne') === 0 ? 'without' : 'extra';
                h += '<div class="item-detail ' + tag + '">' + esc(ex.name);
                if (ex.preis > 0) h += ' <span class="price-tag">+' + centToEuro(ex.preis) + '</span>';
                h += '</div>';
            });
        }
        if (item.upgrade) {
            h += '<div class="item-detail upgrade">+' + esc(item.upgrade.name);
            if (item.upgrade.preis > 0) h += ' <span class="price-tag">+' + centToEuro(item.upgrade.preis) + '</span>';
            h += '</div>';
        }
        h += '</div></div>';
    });
    h += '</div>';

    h += '<div class="order-footer" id="footer-' + order.internalId + '">';
    if (isPaid) {
        h += '<div class="paid-info">';
        h += '<div class="status-label">✓ BEZAHLT</div>';
        if (order.zahlungsart) h += '<div style="font-size:0.8rem;color:var(--gray);margin-top:4px;">' + esc(order.zahlungsart) + '</div>';
        if (order.bonus_kunde && order.bonus_gutgeschrieben) {
            h += '<div class="bonus-msg">+' + order.punkte + ' Bonuspunkte gutgeschrieben</div>';
        } else if (!order.bonus_kunde) {
            h += '<div class="no-bonus">Kein Bonuskonto – keine Punktegutschrift</div>';
        }
        h += '</div>';
    } else if (isStorniert) {
        h += '<div class="paid-info"><div class="status-label" style="color:var(--gray)">STORNIERT</div></div>';
    } else if (isFailed) {
        h += '<button class="pay-btn" onclick="openPaymentDialog(\'' + order.internalId + '\')">ERNEUT VERSUCHEN</button>';
        h += '<button class="retry-btn" onclick="markStorniert(\'' + order.internalId + '\')">STORNIEREN</button>';
    } else {
        var isProcessing = processingPayments[order.internalId];
        h += '<button class="pay-btn" id="payBtn-' + order.internalId + '"' +
            (isProcessing ? ' disabled' : '') +
            ' onclick="openPaymentDialog(\'' + order.internalId + '\')">ZAHLUNG STARTEN</button>';
    }
    h += '</div>';
    h += '</div>';
    return h;
}

function openPaymentDialog(internalId) {
    if (processingPayments[internalId]) return;
    var order = orders.find(function(o) { return o.internalId === internalId; });
    if (!order || order.status === STATUS.BEZAHLT || order.status === STATUS.STORNIERT) return;

    var html = '<h3>Zahlung</h3>';
    html += '<div class="dialog-order">Bestellung #' + order.visibleNumber + '</div>';
    html += '<div class="dialog-amount">' + centToEuro(order.Gesamtbetrag) + '</div>';
    html += '<button class="dialog-btn bar" onclick="startBarPayment(\'' + internalId + '\')">BAR BEZAHLEN</button>';
    html += '<button class="dialog-btn sumup" onclick="startSumUpPayment(\'' + internalId + '\')">MIT SUMUP BEZAHLEN</button>';
    html += '<button class="dialog-btn cancel" onclick="closeDialog()">ABBRECHEN</button>';

    showDialog(html);
}

function startBarPayment(internalId) {
    var order = orders.find(function(o) { return o.internalId === internalId; });
    if (!order || order.status === STATUS.BEZAHLT || order.status === STATUS.STORNIERT) return;

    var html = '<h3>Barzahlung</h3>';
    html += '<div class="dialog-order">Bestellung #' + order.visibleNumber + '</div>';
    html += '<div class="dialog-confirmation">';
    html += '<div class="confirm-text">Wurde der vollständige Betrag von<br><strong style="color:var(--red)">' + centToEuro(order.Gesamtbetrag) + '</strong><br>bar bezahlt?</div>';
    html += '<button class="dialog-btn bar confirm-yes" onclick="confirmBarPayment(\'' + internalId + '\')">JA, BESTÄTIGEN</button>';
    html += '<button class="dialog-btn cancel confirm-no" onclick="closeDialog()">ABBRECHEN</button>';
    html += '</div>';

    showDialog(html);
}

function confirmBarPayment(internalId) {
    if (processingPayments[internalId]) return;
    processingPayments[internalId] = true;

    var order = orders.find(function(o) { return o.internalId === internalId; });
    if (!order || order.status === STATUS.BEZAHLT || order.status === STATUS.STORNIERT) {
        processingPayments[internalId] = false;
        return;
    }
    order.idempotency_id = order.idempotency_id || generateIdempotencyId();

    fetch('/api/bestellung/' + encodeURIComponent(order.token) + '/bezahlt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ idempotency_id: order.idempotency_id })
    }).then(function(r) { return r.json(); }).then(function(data) {
        if (data.ok) {
            order.punkte = Number(data.punkte || order.punkte || 0);
            order.bonus_kunde = Boolean(data.bonus_kunde || order.bonus_kunde);
            applyPaymentSuccess(order, 'BAR');
            processingPayments[internalId] = false;
            loadThekenBestellungen();
            return;
        }
        throw new Error(data.fehler || 'Die Zahlung konnte nicht gespeichert werden.');
    }).catch(function(err) {
        console.error('API-Fehler:', err);
        processingPayments[internalId] = false;
        var html = '<h3>Zahlung nicht gespeichert</h3>';
        html += '<div class="confirm-text">' + esc(err.message) + '</div>';
        html += '<button class="dialog-btn bar" onclick="startBarPayment(\'' + internalId + '\')">ERNEUT VERSUCHEN</button>';
        html += '<button class="dialog-btn cancel" onclick="closeDialog()">ABBRECHEN</button>';
        showDialog(html);
    });
}

function startSumUpPayment(internalId) {
    if (processingPayments[internalId]) return;
    processingPayments[internalId] = true;

    var order = orders.find(function(o) { return o.internalId === internalId; });
    if (!order) { processingPayments[internalId] = false; return; }

    order.status = STATUS.ZAHLUNG_GESTARTET;
    order.zahlungsart = 'SUMUP';
    order.zahlungsstatus = 'STARTED';
    order.idempotency_id = generateIdempotencyId();
    order.sumup_status = 'STARTED';
    renderOrders();

    var html = '<h3>SumUp-Zahlung</h3>';
    html += '<div class="dialog-order">Bestellung #' + order.visibleNumber + ' – ' + centToEuro(order.Gesamtbetrag) + '</div>';
    html += '<div class="sumup-progress">';
    html += '<div class="sumup-step done" id="sumup-step1">✓ SumUp-Zahlung wird gestartet …</div>';
    html += '<div class="sumup-step active" id="sumup-step2">⏳ Warte auf Kartenzahlung am Terminal …</div>';
    html += '<div class="sumup-step pending" id="sumup-step3">Ergebnis wird erwartet …</div>';
    html += '</div>';
    html += '<div class="sumup-actions">';
    html += '<button class="dialog-btn success-btn" onclick="sumupSuccessDemo(\'' + internalId + '\')">✓ ZAHLUNG ERFOLGREICH</button>';
    html += '<button class="dialog-btn fail-btn" onclick="sumupFailDemo(\'' + internalId + '\')">✗ ZAHLUNG FEHLGESCHLAGEN</button>';
    html += '</div>';
    html += '<button class="dialog-btn cancel" style="margin-top:10px" onclick="sumupAbortDemo(\'' + internalId + '\')">ZAHLUNG ABBRECHEN</button>';

    showDialog(html);

    // DEMO: Das Terminal hat die Anfrage angenommen und wartet auf die Karte.
    setTimeout(function() {
        if (processingPayments[internalId] && order.status === STATUS.ZAHLUNG_GESTARTET) {
            order.status = STATUS.ZAHLUNG_AUSSTEHEND;
            order.zahlungsstatus = 'PENDING';
            order.sumup_status = 'PENDING';
            renderOrders();
        }
    }, 250);
}

function sumupSuccessDemo(internalId) {
    var order = orders.find(function(o) { return o.internalId === internalId; });
    if (!order || !processingPayments[internalId] || order.status === STATUS.BEZAHLT) return;

    /*
    // FLASK API: Die Successful-Zahlung wird später vom Server bestätigt.
    // GET /api/theke/bestellungen/{internalId}/zahlungsstatus
    */

    // DEMO
    order.sumup_checkout_id = 'DEMO-CHECKOUT-' + Date.now();
    order.sumup_transaction_id = 'DEMO-TX-' + Date.now();
    order.sumup_status = 'SUCCESS';
    applyPaymentSuccess(order, 'SUMUP');
    processingPayments[internalId] = false;
}

function sumupFailDemo(internalId) {
    var order = orders.find(function(o) { return o.internalId === internalId; });
    if (!order || !processingPayments[internalId] || order.status === STATUS.BEZAHLT) return;

    order.status = STATUS.ZAHLUNG_FEHLGESCHLAGEN;
    order.zahlungsstatus = 'FAILED';
    order.sumup_status = 'FAILED';
    processingPayments[internalId] = false;
    closeDialog();
    renderOrders();
}

function sumupAbortDemo(internalId) {
    var order = orders.find(function(o) { return o.internalId === internalId; });
    if (!order || !processingPayments[internalId] || order.status === STATUS.BEZAHLT) return;

    order.status = STATUS.WARTET_AUF_ZAHLUNG;
    order.zahlungsart = null;
    order.zahlungsstatus = null;
    order.sumup_status = 'CANCELLED';
    processingPayments[internalId] = false;

    /*
    // FLASK API: POST /api/theke/bestellungen/{internalId}/zahlung-abbrechen
    */

    closeDialog();
    renderOrders();
}

// ============================================================
// ZAHLUNGSVERARBEITUNG
// ============================================================
function applyPaymentSuccess(order, zahlungsart) {
    if (!order || order.status === STATUS.BEZAHLT) return;
    if (order.bonus_kunde && !order.bonus_gutgeschrieben) {
        order.bonus_gutgeschrieben = true;
    }

    order.status = STATUS.BEZAHLT;
    order.zahlungsart = zahlungsart;
    order.zahlungsstatus = 'PAID';
    order.bezahlt_am = new Date().toISOString();

    closeDialog();
    renderOrders();
}

function markStorniert(internalId) {
    var order = orders.find(function(o) { return o.internalId === internalId; });
    if (!order || order.status === STATUS.BEZAHLT || processingPayments[internalId]) return;
    if (!window.confirm('Bestellung #' + order.visibleNumber + ' wirklich stornieren?')) return;
    order.status = STATUS.STORNIERT;
    order.zahlungsstatus = 'STORNIERT';
    renderOrders();
}

    document.getElementById('dialogContent').innerHTML = html;

}

function closeDialog() {
    document.getElementById('paymentDialog').classList.remove('show');

// ============================================================
// AUTO-REFRESH VORBEREITUNG
// ============================================================
var refreshInterval = null;

function loadThekenBestellungen() {
    return fetch('/api/theke/bestellungen', {
        headers: { 'Accept': 'application/json' },
        cache: 'no-store'
    })
        .then(function(response) {
            if (response.status === 401) {
                window.location.href = '/mitarbeiter-login?next=/theke';
                throw new Error('Nicht angemeldet');
            }
            return response.json().then(function(data) {
                if (!response.ok || !data.ok) {
                    throw new Error(data.fehler || 'Bestellungen konnten nicht geladen werden.');
                }
                return data;
            });
        })
        .then(function(data) {
            orders = data.bestellungen || [];
            document.getElementById('badgeConn').textContent = '● Verbunden';
            document.getElementById('badgeConn').style.color = 'var(--green)';
            renderOrders();
        })
        .catch(function(error) {
            if (error.message === 'Nicht angemeldet') return;
            document.getElementById('badgeConn').textContent = '● Verbindung getrennt';
            document.getElementById('badgeConn').style.color = '#ef4444';
            console.error('Theken-API:', error);
        });
}

function startAutoRefresh(ms) {
    stopAutoRefresh();
    refreshInterval = setInterval(function() {
        if (!IS_LOCAL_DEMO) loadThekenBestellungen();
    }, ms || 10000);
}

function stopAutoRefresh() {
    if (refreshInterval) clearInterval(refreshInterval);
}
